server:
  port: 8123

spring:
  messages:
    basename: i18n/messages
    cache-duration: -1
    use-code-as-default-message: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
jwt:
  secretKey: u6J7f7MdE0wWQ2s9nQXwVnqR6d5tZgGzQXq42u+0Hpw=
  expiration: 86400


logging:
  level:
    root: info
    com.hades.hadescoffee: info
  file:
    name: ./logs/hades-coffee-log
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false